<!DOCTYPE html>
<hmtl>

    <head>
        <title>Pink Goose</title>
        <link rel="stylesheet" href="css/pinkgoose-contact.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
    </head>

    <body>

        <header class="header">
            <div class="logo">Pink<span class="pink"> Goose</span></span></div>
            <nav>
                <a href="pinkgoose.html">Home</a>
                <a href="pinkgoose-learn.html">Learn</a>
                <a href="pinkgoose-about.html">About</a>
                <a href="pinkgoose-contact.html">Contact</a>
            </nav>
            <a class="login">login</a>
        </header>

        <section class="contact-bottom">
            <h1 class="goose-idea">What's your GOOSE idea?</h1>
            <h2 class="lets-help">Let's chat and see how we can help</h2>

            <div class="email-contact">

                <div class="telegram">
                    <img src="images/telegram.png" alt="telegram" class="telegram-image">
                    <div class="telegram-text">
                        <p style="color: #4D3705;"><b>telegram</b></p>
                        <p style="color: #836204;">@superdao_team</p>
                    </div>
                </div>


                <div class="email-dao">
                    <img src="images/email.png" alt="email icon" class="email-image">
                    <div class="email-text">
                        <p style="color: #40354B;"><b>email</b></p>
                        <p style="color: #715F7F;">hello@superdao.co</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="post">
            <h2 class="post-title">Send a post Goose</h2>
            <form action="">
                <div class="make-post">
                    <input class="info" type="email" placeholder="Your email" required>
                    <input class="info" type="name" placeholder="Your name" required>
                    <textarea class="message" type="messsage" placeholder="Your message" required></textarea>
               <select class="color">
                <option value disabled selected>color of your goose</option>
                <option>red</option>
                <option>white</option>
                <option>black</option>
                <option>blue</option>
               </select>
                </div>
                <div class="send-button">
                    <button class="send">send</button>
                </div>
            </form>
        </section>

        <footer>
            <div class="footer-socials">
                <div class="footer-items">
                    <a>About</a>
                    <a>Jobs</a>
                    <a style="color: #FFC803;">Legal</a>
                </div>
                <div class="socials-items">
                    <img src="images/twitter.png" alt="Twitter" class="socials">
                    <img src="images/telegram-bottom.png" alt="Telegram" class="socials">
                    <img src="images/youtube.png" alt="YouTube" class="socials">
                    <img src="images/discord.png" alt="Discord" class="socials">
                </div>
            </div>
        </footer>


    </body>
</hmtl>
